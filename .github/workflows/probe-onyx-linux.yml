name: Probe Onyx Linux AppImage (temporary)

# DOČASNÝ workflow: ověří, jestli AppImage od mtolly/onyx obsahuje CLI-schopnou
# binárku (jako Windows/Mac verze), tj. reaguje na `import` a `build` argumenty
# stejně jako ostatní platformy. Po ověření se smaže.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download Onyx Linux AppImage
        run: |
          curl -L -o onyx.AppImage \
            https://github.com/mtolly/onyx/releases/download/20251011/onyx-20251011-linux-x64.AppImage
          chmod +x onyx.AppImage
          echo "size:"; ls -la onyx.AppImage

      - name: Extract AppImage
        run: |
          ./onyx.AppImage --appimage-extract >/dev/null
          echo "=== squashfs-root layout ==="
          ls -la squashfs-root/
          echo "=== AppRun ==="
          file squashfs-root/AppRun 2>&1 || true
          head -c 200 squashfs-root/AppRun 2>&1 || true
          echo ""
          echo "=== usr/bin ==="
          ls -la squashfs-root/usr/bin/ 2>&1 || echo "(no usr/bin)"
          echo "=== potentially executable ELFs at top level ==="
          find squashfs-root -maxdepth 3 -type f -executable | head -20

      - name: Try CLI --help
        continue-on-error: true
        run: |
          echo "=== ./AppRun --help ==="
          ./squashfs-root/AppRun --help 2>&1 | head -50 || true
          echo "=== exit: $? ==="

      - name: Try CLI import --help
        continue-on-error: true
        run: |
          echo "=== ./AppRun import --help ==="
          ./squashfs-root/AppRun import --help 2>&1 | head -50 || true
          echo "=== exit: $? ==="

      - name: Try invoking AppImage directly with --help (with libfuse fallback)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libfuse2 >/dev/null 2>&1 || true
          echo "=== ./onyx.AppImage --help ==="
          ./onyx.AppImage --help 2>&1 | head -50 || true
          echo "=== exit: $? ==="

      - name: Look for a real onyx binary inside AppImage
        run: |
          echo "=== files containing 'onyx' in name ==="
          find squashfs-root -iname '*onyx*' -type f | head -20
          echo "=== ELF binaries inside AppImage ==="
          find squashfs-root -type f -executable -exec file {} \; 2>/dev/null | grep -i "ELF" | head -20
